<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#040A15" />
      <stop offset="50%" stop-color="#0A1628" />
      <stop offset="100%" stop-color="#1E3A8A" />
    </linearGradient>
    <linearGradient id="accent" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#60A5FA" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>
  
  <!-- Background Shield/Rounded Box -->
  <rect x="20" y="20" width="472" height="472" rx="118" fill="url(#bg)" stroke="rgba(255,255,255,0.15)" stroke-width="8" />
  
  <!-- Outer Corner Brackets (Biometric Scanner Motif) -->
  <path d="M 124 170 L 124 124 L 170 124" fill="none" stroke="#60A5FA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 388 170 L 388 124 L 342 124" fill="none" stroke="#60A5FA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 124 342 L 124 388 L 170 388" fill="none" stroke="#60A5FA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  <path d="M 388 342 L 388 388 L 342 388" fill="none" stroke="#60A5FA" stroke-width="14" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
  
  <!-- Center Shield Icon -->
  <path d="M 256 112 C 202 112 160 128 160 128 V 262 C 160 336 256 396 256 396 C 256 396 352 336 352 262 V 128 C 352 128 310 112 256 112 Z" fill="rgba(59, 130, 246, 0.18)" stroke="url(#accent)" stroke-width="12" stroke-linejoin="round" />
  
  <!-- Checkmark / Biometric Verify Motif -->
  <path d="M 214 256 L 246 288 L 304 224" fill="none" stroke="#34D399" stroke-width="16" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)" />
</svg>
